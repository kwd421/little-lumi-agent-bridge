name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test
        run: ./scripts/test.sh
      - name: Package release
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: little-lumi-agent-bridge
          path: |
            dist/*.jar
            release/*.zip
          if-no-files-found: error
